<!doctype html>

<!--
  `sy-atlas` is the widget's style scope (src/lib/scope.ts). Every selector in the
  built stylesheet is confined under it, and standalone there is no widget wrapper
  to carry it — <html> is the theme root, so it carries it here. Without it the
  standalone app renders unstyled.
-->
<html class="sy-atlas" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!--
      No `maximum-scale` and no `user-scalable`: a reader who needs to magnify the map or a
      venue address must be able to, and this shell is a page in its own right rather than
      an app chrome. iOS Safari's other zoom — the one that scales the whole page when a
      field under 16px is focused — is prevented at the fields instead, which keeps pinch
      available (#322).
    -->
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
    <!--
      Resist direct indexing (issue #106); the policy is written down in public/robots.txt.
      Two things make this tag worth having on top of the X-Robots-Tag header:

      It is the layer that does not depend on Cloudflare. `_headers` is a Pages construct,
      so the header is absent under `pnpm preview`, behind a mirror, or after any move off
      Pages — the tag travels with the document. And it is standalone-gated BY CONSTRUCTION
      rather than by a runtime flag: index.html is the standalone shell, while the embed
      loads embed.js into a page whose <head> is the host's, so no robots directive of ours
      can reach a host site. `_redirects` serves this shell for every unknown path, so one
      static tag covers every route.
    -->
    <meta name="robots" content="noindex" />
    <title>Meditation classes</title>
    <!--link href="/favicon.ico" rel="icon" /-->
    <!--link href='https://api.tiles.mapbox.com/mapbox-gl-js/v3.9.3/mapbox-gl.css' rel='stylesheet' /-->
  </head>
  <body>
    <div id="syatlas"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
