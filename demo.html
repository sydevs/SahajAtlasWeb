<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- <script src="https://sahajatlas.com/embed.js" type="module"></script> -->
    <script src="http://localhost:4173/embed.js" type="module"></script>
    <!--
      Host-facing integration reference: docs/embedding.md — the snippet, every
      attribute, sizing, the URL/#anchor behaviour, the full Content-Security-Policy
      contract and a troubleshooting table. Keep this file's comments consistent
      with it rather than restating it; the guide is the one that gets read by the
      sites that embed us.
    -->
  </head>
  <body>
    <header>
      <h1>Sahaj Atlas Widget</h1>
      <p>This is a test</p>
    </header>
    <!--
      Full map (default). Add map="false" to render content-only (no map canvas).

      MAP MODE NEEDS A FULL-PAGE SLOT, and that is a requirement rather than a bug
      (issue #107): the canvas is `position: fixed; inset: 0` and the panels over it are
      fixed too, so the widget covers the viewport whatever box this element is given —
      which is why the element below is deliberately left unsized. Put a map-mode embed
      in a narrow column or give it its own height and it paints over the rest of the
      page; the widget now says so in the console rather than leaving you to find out.
      For an embed that stays inside your layout, use map="false" (see below), which is
      container-relative throughout and adapts to the element's own width.

      PUT A WORKING KEY IN api-key BEFORE LOADING THIS PAGE. The literal that used to
      sit here was dead — SahajCloud answers 403 to it, exactly as it does to no key at
      all — so the harness looked broken in a way that had nothing to do with the code
      under test. Use the same key `pnpm dev` uses: VITE_SAHAJCLOUD_API_KEY in
      .env.local (see .claude/docs/environment.md). It is a published, read-only key,
      but it is not committed, which is why this is a placeholder rather than a value.
    -->
    <sahaj-atlas api-key="REPLACE_WITH_VITE_SAHAJCLOUD_API_KEY" locale="fr"></sahaj-atlas>

    <!--
      A host anchor, for the foreign-hash check (issue #92). Load this page at
      `#respond` — the shape a WordPress comment link has — and the widget must still
      render, with `location.hash` left as `#respond` and the browser scrolled here.
      Before, react-router read that hash as a location outside the `!` basename and
      the widget rendered nothing at all.
    -->
    <div style="height: 150vh"></div>
    <h2 id="respond">Host anchor (#respond)</h2>

    <!--
      Embedded event/registration form: the same element in map="false" mode,
      booted directly on an event (or `<event-path>/register`) route via
      base-path. The event/register headers are self-sufficient (title, when,
      where, Free, an "on Sahaj Atlas" backlink) — no map or list chrome exists
      in this mode. A hash route the visitor already navigated to wins over
      base-path. The HOST sizes the element (the map-less widget fills its
      slot); an unsized custom element collapses to zero height.

        <sahaj-atlas
          style="display:block;height:640px"
          api-key="…"
          map="false"
          base-path="/507/register"
        ></sahaj-atlas>

      Style-scoping caveat (honest limits): the widget is deliberately
      shadow-DOM-free — its theme is scoped to a wrapper div and its CSS is
      injected by JS — so "no style inheritance from the host page" is
      approximate, not a hard guarantee. Aggressive host CSS (e.g. global
      `button { … }` rules) can still bleed in; a hard boundary would need
      shadow DOM, which conflicts with the widget's portal/drawer architecture.
    -->
  </body>
</html>
