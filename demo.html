<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!--
      Host-facing integration reference: docs/embedding.md — the snippet, every
      parameter, sizing, the URL/#anchor behaviour, the full Content-Security-Policy
      contract and a troubleshooting table. Keep this file's comments consistent
      with it rather than restating it; the guide is the one that gets read by the
      sites that embed us.

      THE LOADER GOES IN THE BODY, not here. It inserts the element immediately before
      its own script tag and refuses to render into <head>, so a snippet up here would
      log an error and show nothing. That refusal is deliberate: an element in <head>
      upgrades normally and paints nothing, which is the worst kind of failure.
    -->
  </head>
  <body>
    <header>
      <h1>Sahaj Atlas Widget</h1>
      <p>This is a test</p>
    </header>
    <!--
      Full map (default). Add &map=false to render content-only (no map canvas).

      A MAP EMBED WITH NO HEIGHT OF ITS OWN TAKES THE WHOLE WINDOW: the canvas is
      `position: fixed; inset: 0` and the panels over it are fixed too, so it covers the
      viewport whatever box the element is in. That is what this tag does, and it is
      right for a dedicated atlas page.

      GIVE `<sahaj-atlas>` A `display: block` AND A HEIGHT AND THE MAP LIVES IN THAT BOX
      instead (issue #169) — `MapFrame` takes the containing block with `contain: layout`,
      so the canvas, the drawers and the peek strips all resolve against your element and
      nothing paints outside it. That is the shape to reach for when the page has a header
      above the atlas. `map=false` (below) is the third option: no map at all, and
      container-relative throughout.

      An unsized map embed that does not have the page to itself degrades to the compact
      card and says so in the console, rather than leaving you to find out.

      PUT A WORKING KEY IN THE `key` PARAMETER BEFORE LOADING THIS PAGE. The literal
      that used to sit here was dead — SahajCloud answers 403 to it, exactly as it does
      to no key at all — so the harness looked broken in a way that had nothing to do
      with the code under test. Use the same key `pnpm dev` uses:
      VITE_SAHAJCLOUD_API_KEY in .env.local (see docs/environment.md). It is a
      published, read-only key, but it is not committed, which is why this is a
      placeholder rather than a value.
    -->
    <script
      src="http://localhost:4173/auto.js?key=REPLACE_WITH_VITE_SAHAJCLOUD_API_KEY&locale=fr"
      type="module"
    ></script>

    <!--
      A host anchor, for the foreign-hash check (issue #92). Load this page at
      `#respond` — the shape a WordPress comment link has — and the widget must still
      render, with `location.hash` left as `#respond` and the browser scrolled here.
      Before, react-router read that hash as a location outside the `!` basename and
      the widget rendered nothing at all.
    -->
    <div style="height: 150vh"></div>
    <h2 id="respond">Host anchor (#respond)</h2>

    <!--
      Embedded event/registration form: the same loader in map=false mode, booted
      directly on an event (or `<event-path>/register`) route via the `atlas`
      parameter. The
      event/register headers are self-sufficient (title, when, where, Free) — no map or
      list chrome exists in this mode. A route already on the page's own URL wins over
      the embed's default. The HOST sizes the element (the map-less widget fills its slot);
      an unsized custom element collapses to zero height, and since the loader inserts
      the element for you, size it with a rule rather than an inline style.

        <style>
          sahaj-atlas {
            display: block;
            height: 640px;
          }
        </style>
        <script
          src="http://localhost:4173/auto.js?key=…&map=false&atlas=/507/register"
          type="module"
        ></script>

      Style-scoping caveat (honest limits): the widget is deliberately
      shadow-DOM-free — its theme is scoped to a wrapper div and its CSS is
      injected by JS — so "no style inheritance from the host page" is
      approximate, not a hard guarantee. Aggressive host CSS (e.g. global
      `button { … }` rules) can still bleed in; a hard boundary would need
      shadow DOM, which conflicts with the widget's portal/drawer architecture.
    -->
  </body>
</html>
