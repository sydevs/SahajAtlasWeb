<!doctype html>

<!--
  The Turnstile challenge, served from the widget's own origin and framed by the widget
  (#343). src/challenge.ts and src/lib/turnstile-frame.ts carry the reasoning; this file is
  deliberately thin, because Vite strips no HTML comment and every byte here is fetched inside
  a frame on the registration path.

  ⚠ The reset below is in `style` ATTRIBUTES and may not move into a `<style>` block:
  scripts/postcss-scope-widget.mjs rewrites every selector in this build to `:where(.sy-atlas)`,
  which matches nothing on this page.
-->
<html lang="en" style="margin: 0; padding: 0; background: transparent; overflow: hidden">
  <head>
    <meta charset="UTF-8" />
    <!-- As index.html: the layer that does not depend on Cloudflare serving public/_headers. -->
    <meta name="robots" content="noindex" />
    <title>Security check</title>
  </head>
  <body style="margin: 0; padding: 0; background: transparent; overflow: hidden">
    <div id="challenge"></div>
    <script type="module" src="/src/challenge.ts"></script>
  </body>
</html>
