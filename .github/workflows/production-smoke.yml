name: Production Smoke

# Runs the smoke specs against the deploy visitors and host sites actually
# get (issue #244). Why the PR gate can only ever read a preview, why the
# deploy fires the run rather than a clock, why the host is `sahajatlas.com`
# and not `*.pages.dev` (#148), and ⚠ why the trigger is Cloudflare's check
# run rather than the `deployment_status` #244 specified: `docs/testing.md`
# → "The PR gate can only ever read a preview".
#
# Deliberately NO `concurrency` group. Two production reads at once cost a
# few dozen CDN requests; `cancel-in-progress` would instead throw away a
# verdict the lane had already paid for.

on:
  check_run:
    types: [completed]
  # No inputs. The host is the one thing this lane must not take from
  # anywhere, so a hand-run reads production like every other run does.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Production smoke
    # Every filter lives here on purpose: a non-production event SKIPS the
    # job, so it never reaches a step and never reads as a green run that
    # checked nothing. The name is the app's Pages project, not the
    # `-design` Ladle playground, which deploys from this repo too.
    #
    # Two independent conditions say "this is a main-branch build", and
    # neither can admit a preview: a PR head is not the default branch, and
    # it is not the default branch's tip either. Taking both means a null
    # `head_branch` cannot silence the lane.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event.check_run.conclusion == 'success' &&
      startsWith(github.event.check_run.app.slug, 'cloudflare') &&
      github.event.check_run.name == 'Cloudflare Pages: sahajatlas' &&
      (github.event.check_run.check_suite.head_branch == github.event.repository.default_branch ||
      github.event.check_run.check_suite.head_sha == github.sha)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # reads packageManager from package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The base URL is a literal with no expression in it, so nothing this
      # job does not control can choose or blank the host it reads.
      #
      # The guard below cannot fire today, and is here for the edit that
      # would make it fire: `skipWithoutPreview` makes every spec skip
      # itself on an empty value, so the day this value comes from anywhere
      # the job must go red rather than collect a green check that ran
      # nothing. It shares this step with the specs so no `if:` can route
      # around it.
      #
      # The summary is written BEFORE the specs, so a red run names the
      # deploy it read.
      - name: Run the smoke specs against production
        env:
          PREVIEW_URL: https://sahajatlas.com
        run: |
          if [ -z "$PREVIEW_URL" ]; then
            echo "::error::No deploy to read — every smoke spec would skip itself and report green."
            exit 1
          fi
          {
            echo "### Production smoke"
            echo ""
            echo "🚀 Reading \`$PREVIEW_URL\`."
          } >> "$GITHUB_STEP_SUMMARY"
          pnpm test:smoke
