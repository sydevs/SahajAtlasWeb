name: Audit

# This is the scheduled half of the dependency-vulnerability check (issue #99).
#
# The PR gate in `ci.yml` is a hard gate, but a scoped one. A plain
# `pnpm audit --audit-level high` would fail on day one: the lockfile
# already held 1 critical and 24 high advisories, and 64 had built up while
# every gate stayed green. That would block every unrelated PR until the
# dependency-update tickets landed. A purely scheduled report cannot stop a
# regression from merging, and is exactly the kind of check nobody reads.
#
# So the PR gate fails only on a high or critical advisory that
# scripts/audit-baseline.json does not already pin. Each pinned entry names
# the ticket that owns it. The gate stays green until a genuinely new
# advisory appears.
#
# This weekly run adds `--strict` and enforces two softer states the PR
# gate deliberately tolerates, so a PR is never blocked by something it did
# not cause:
#
#   - a baselined advisory that has since been fixed but not pruned, and
#   - an audit that could not run at all (a registry outage, or a change to
#     pnpm's output format).
#
# Both matter. An unpruned baseline slowly turns into a blanket allowlist.
# A permanently broken audit is a green check that checks nothing. A
# failure here interrupts nobody's work. It only turns red in the Actions
# tab.
#
# Advisories arrive on their own schedule, not ours. That is the other
# reason this run is independent of PR traffic: a quiet week should not
# mean a blind one.
#
# Two known gaps, recorded so nobody mistakes them for coverage:
#
#   - Scope is `--prod`, matching the readiness report. So the build
#     toolchain (vite, vitest, eslint, @ladle/react, jsdom, typescript) is
#     not gated, even though it runs on developer machines and CI runners.
#     This gap used to cost 8 further high advisories. As of #101, a full
#     `pnpm audit` reports 0 advisories at every severity, across all 1103
#     packages, the same as `--prod` reports across 417 packages. So
#     widening the scope today needs no new baseline entries at all — the
#     cheapest this will ever be, cheaper than after the next dev-tool
#     advisory lands. This stays a deliberate, separate decision, not
#     folded into a routine dependency bump.
#   - GitHub disables a scheduled workflow after 60 days with no repository
#     activity. If this run stops appearing in the Actions tab, that is why.
#     Re-enable it there. The PR gate keeps working regardless.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Weekly Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # reads packageManager from package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      # No `pnpm install`: `pnpm audit` resolves from the lockfile alone.
      - run: pnpm audit:check --strict
