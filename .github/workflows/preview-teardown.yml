name: Preview Teardown

# Takes down the preview `ci.yml`'s smoke job published for a pull request (#282).
#
# ⚠ This is the ONLY chance to do it. Wrangler has no `preview list`, so there can be no later
# sweep: a preview nobody deletes here is unreachable to tooling forever
# (sydevs/SahajCloud#903). It therefore runs on every close, merged or not.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  delete:
    name: Delete the pull request's preview
    # A fork never published one — it holds no Cloudflare credential, which is also why its CI
    # run takes the annotated skip rather than a red check.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # ⚠ `--skip-confirmation` (alias `-y`) is load-bearing: `previewDeleteCommand`'s own arg
      # table defaults it to `false` and `previewDelete` then prompts, and a prompt in a
      # workflow is not a failure anyone can read.
      #
      # ⚠ `continue-on-error`, because wrangler has no "if exists" path here: `previewDelete`
      # ends in a bare `deletePreview`, and the CLI carries a `The Preview "<name>" was not
      # found` error for exactly this case. A second close of the same pull request would
      # otherwise fail the job. Both read off wrangler 4.150.0's own source.
      #
      # `--config` is explicit for the same reason as the publish step: two configs build from
      # this repo, and the default resolution is one rename away from targeting the playground.
      - name: Delete the preview
        id: delete
        continue-on-error: true
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.150.0'
          command: preview delete --name pr-${{ github.event.pull_request.number }} --config wrangler.jsonc --skip-confirmation

      # `continue-on-error` hides the outcome from the run's own status, so the summary is the
      # only place a reader learns whether the preview is actually gone. A leak that nothing can
      # sweep must not also be silent.
      - name: Say whether the preview is gone
        env:
          OUTCOME: ${{ steps.delete.outcome }}
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            echo "🧹 Deleted the \`$PREVIEW_NAME\` preview." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Preview teardown"
            echo ""
            echo "⚠️ \`wrangler preview delete\` did not succeed for \`$PREVIEW_NAME\` ($OUTCOME)."
            echo ""
            echo "An already-deleted preview reports \`was not found\`, which is the expected"
            echo "outcome on a second close. Anything else leaves a preview no sweep can reach:"
            echo "read the step's log and delete it by hand."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::wrangler preview delete did not succeed for $PREVIEW_NAME ($OUTCOME). Read the step log — a leaked preview cannot be swept later."
