name: CI

on: pull_request

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # Cloudflare posts the preview URL in a PR comment
  statuses: read # fallback: preview URL in a commit status target_url
  deployments: read # fallback: preview URL in a deployment environment_url
  checks: read # fallback: preview URL in a check-run output

jobs:
  gate:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # reads packageManager from package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:run # unit lane — smoke specs are excluded in vitest.config.ts
      - run: pnpm build
      - name: Bundle-size budget
        # Measures the eager first-load payload, gzipped: the standalone
        # shell's entry plus its modulepreload closure, and embed.js's
        # static import graph. Never budget one chunk alone — the build
        # re-chunks freely. Full rationale: AGENTS.md and the script itself.
        run: pnpm size
      - run: pnpm ladle:build # fail the gate on broken component stories

      # Exercises the credentialed source-map path (#130), with no network
      # call and no real secret. See AGENTS.md's "Deployment" section for
      # the full rationale.
      #
      # `SENTRY_URL` points at a closed port, so the upload fails at once
      # and nothing leaves the runner. This step still proves that maps are
      # emitted under a token, that `errorHandler` keeps a failed upload
      # non-fatal, that deletion still runs, and that `assert:maps` finds
      # `dist/` clean afterward.
      #
      # The token below is a literal, not a secret, so this step also runs
      # on forked PRs, where real secrets are unavailable.
      - name: Source-map upload chain (offline dry run)
        env:
          SENTRY_AUTH_TOKEN: ci-dry-run-not-a-secret
          SENTRY_ORG: ci-dry-run
          SENTRY_PROJECT: ci-dry-run
          SENTRY_URL: http://127.0.0.1:1/
        run: pnpm build

  # Dependency-vulnerability gate. Fails only on a high or critical advisory
  # that scripts/audit-baseline.json does not already pin (each pinned entry
  # names the ticket that owns it). See audit.yml for the full tradeoff
  # behind a hard-but-scoped gate, and for the weekly ratchet that prunes
  # fixed baseline entries.
  #
  # Scope is `--prod` only, so the build toolchain (vite, vitest, eslint,
  # jsdom, and so on) is not covered here. This job skips `pnpm install`:
  # `pnpm audit` resolves from the lockfile alone, so no lifecycle scripts
  # need to run.
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # the four read scopes above exist for preview discovery, not this
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm audit:check

  # Smoke specs run against the Cloudflare Pages PR preview. This job finds
  # the preview URL through the GitHub API, since Cloudflare posts it on the
  # PR. It waits until the preview is reachable, then fetches the root page.
  # A missing preview is a graceful skip only on forks: forks have no
  # secrets and no preview by design. On a same-repo PR, a missing preview
  # fails the job. See "Report a missing preview" below for what the
  # failure tells you to do next.
  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Emits `preview_url` and `preview_status`. It waits 10 minutes by
      # default, a number measured against 86 real Cloudflare builds (see
      # the script's header for the full data). It never fails the job
      # itself. Set PREVIEW_TIMEOUT_MS here to wait longer. The value is in
      # milliseconds, and the script caps it: an override past this job's
      # `timeout-minutes` gets the job cancelled, which skips the reporting
      # step below and leaves a red check with no message.
      - name: Discover Cloudflare Pages preview URL
        id: preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CF_PROJECT: sahajatlas.pages.dev # the app's *.pages.dev host (not the sahajatlas-design Ladle playground)
        run: node scripts/get-cloudflare-preview-url.mjs
      - name: Run smoke specs against the preview
        if: ${{ steps.preview.outputs.preview_url != '' }}
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          pnpm test:smoke
          {
            echo "### Smoke"
            echo ""
            echo "✅ Smoke specs ran against \`$PREVIEW_URL\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # A skip must never look like a pass. Discovery exits 0 with an empty
      # URL when no preview turns up, and the specs then skip themselves. So
      # this step keeps the invariant: a green "Smoke" check always means
      # the specs ran. See docs/testing.md for the full history (issue #132).
      #
      # Same-repo PRs carry the secrets and the Cloudflare integration. So a
      # missing preview there is a real failure: the deploy did not happen.
      # This fails the job. Forked PRs get no preview by design, so they
      # stay a graceful, annotated skip, and so do local `pnpm test:smoke`
      # runs.
      #
      # Both branches below fail a same-repo PR. Only the message differs,
      # because only one of the two is a defect. `preview_status` carries
      # that distinction: `absent` means Cloudflare posted nothing at all
      # for this commit. `pending` or `unreachable` means a deploy
      # demonstrably exists and this step stopped waiting on it.
      - name: Report a missing preview
        if: ${{ steps.preview.outputs.preview_url == '' }}
        env:
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PREVIEW_STATUS: ${{ steps.preview.outputs.preview_status }}
        run: |
          case "$PREVIEW_STATUS" in
            pending | unreachable)
              MSG="Cloudflare had not published a usable preview before discovery gave up — NO smoke specs ran."
              HINT="A Cloudflare deploy for this commit WAS seen ($PREVIEW_STATUS), so this is a slow deploy rather than a broken one: RE-RUN this job. The 'Discover Cloudflare Pages preview URL' step reports how long it waited and what it last saw. If it keeps happening, raise PREVIEW_TIMEOUT_MS on that step rather than re-running by hand."
              ;;
            failed)
              MSG="The Cloudflare Pages build for this commit FAILED — NO smoke specs ran."
              HINT="Cloudflare finished and did not succeed, so re-running this job will fail identically: read the Cloudflare deployment log. If that build failed in 0s with a clean log, it is a transient rate-limit — retry the DEPLOYMENT (not this job)."
              ;;
            error)
              MSG="Preview discovery could not run — NO smoke specs ran."
              HINT="This is a fault in the discovery step itself, not in Cloudflare: read the 'Discover Cloudflare Pages preview URL' step, which prints why (usually a missing GITHUB_TOKEN / PR_HEAD_SHA)."
              ;;
            # `absent`, and any unrecognized status. An unknown status gets
            # the loud message on purpose. This stops a future status from
            # quietly inheriting the softer "just re-run it" advice.
            *)
              MSG="No Cloudflare Pages preview was found for this commit — NO smoke specs ran."
              HINT="Nothing from Cloudflare turned up for this commit at all, so the deploy did not happen: INVESTIGATE, don't re-run. If the Pages build failed in 0s with a clean log, that is a transient rate-limit — retry the deployment itself."
              ;;
          esac
          {
            echo "### Smoke"
            echo ""
            echo "⚠️ $MSG"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SAME_REPO" = "true" ]; then
            echo "::error::$MSG This PR is from the same repository, so a preview was expected. $HINT"
            exit 1
          fi
          echo "::warning::$MSG Forked PRs have no preview deployment, so the specs were skipped."
