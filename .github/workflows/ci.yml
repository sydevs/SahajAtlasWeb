name: CI

on: pull_request

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # Cloudflare posts the preview URL in a PR comment
  statuses: read # fallback: preview URL in a commit status target_url
  deployments: read # fallback: preview URL in a deployment environment_url
  checks: read # fallback: preview URL in a check-run output

jobs:
  gate:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # reads packageManager from package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:run # unit lane — smoke specs are excluded in vitest.config.ts
      - run: pnpm build
      - name: Bundle-size budget
        # Measures the EAGER first-load payload — the standalone shell's entry +
        # modulepreload closure, and embed.js's static import graph — gzipped,
        # against a committed budget. Per-chunk sizes are meaningless here (the
        # build re-chunks freely), which is why nothing caught the payload
        # growing to ~477 KiB gz unnoticed. Budget + rationale live in the script.
        run: pnpm size
      - run: pnpm ladle:build # fail the gate on broken component stories

      # Exercise the CREDENTIALED source-map path (#130) without a network or a secret.
      #
      # Every step above runs the uncredentialed path, because CI has no token — so until
      # this job existed, the first machine ever to execute map emission, deletion and the
      # gate together was Cloudflare, on a production deploy. That is the wrong place to
      # discover a broken option name.
      #
      # `SENTRY_URL` points at a closed port, so the upload fails immediately and nothing
      # leaves the runner. What is being asserted is everything around it: maps ARE emitted
      # under a token, `errorHandler` keeps a failed upload non-fatal, deletion still runs
      # in `writeBundle`'s `finally`, and `assert:maps` (which `pnpm build` ends in) proves
      # `dist/` is clean afterwards. A regression in any of those turns this red.
      #
      # The token value is a literal, not a secret: this must keep working on forked PRs,
      # where secrets are unavailable and where a leak would matter most.
      - name: Source-map upload chain (offline dry run)
        env:
          SENTRY_AUTH_TOKEN: ci-dry-run-not-a-secret
          SENTRY_ORG: ci-dry-run
          SENTRY_PROJECT: ci-dry-run
          SENTRY_URL: http://127.0.0.1:1/
        run: pnpm build

  # Dependency-vulnerability gate.
  #
  # THE TRADEOFF, since this is the decision reviewers will want justified:
  # a plain `pnpm audit --audit-level high` as a hard gate is red on the day it
  # lands (1 critical + 24 high are already in the lockfile) and would block every
  # unrelated PR until the dependency-update tickets land; a purely scheduled
  # report, meanwhile, cannot stop a regression from merging and is exactly the
  # kind of check that goes unread — which is how 64 advisories accumulated with
  # every gate green.
  #
  # So the gate is hard, but scoped: known findings are pinned in
  # scripts/audit-baseline.json (each named with the ticket that owns it) and the
  # job fails only on a high/critical advisory that ISN'T pinned. Green today,
  # red the day a genuinely new one appears. Waiving one costs a reviewable line
  # in that file rather than a silent pass.
  #
  # The complementary ratchet — nagging when a baselined advisory has been fixed
  # but not pruned — lives in the weekly `audit.yml`, where it can't block a PR.
  #
  # SCOPE: `--prod` only, matching how the readiness report measured. Advisories
  # in the build toolchain (vite, vitest, eslint, jsdom, …) are NOT covered by
  # this job — see the note in audit.yml.
  #
  # No `pnpm install`: `pnpm audit` resolves from the lockfile alone, so no
  # dependency lifecycle scripts run here.
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # the four read scopes above exist for preview discovery, not this
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm audit:check

  # Smoke specs run against the Cloudflare Pages PR preview. We discover the
  # preview URL from the GitHub API (Cloudflare posts it on the PR) and wait
  # until it's reachable, then fetch the root page. A missing preview is a
  # graceful skip only on FORKS (no secrets, no preview by design); on a
  # same-repo PR it fails the job — see "Report a missing preview" below, which
  # also decides what the failure tells you to do about it.
  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Emits `preview_url` and `preview_status`. It waits 10 minutes by default —
      # a number measured against 86 real Cloudflare builds, see the script's
      # header — and never fails the job itself. Set PREVIEW_TIMEOUT_MS here to
      # wait longer; it is in MILLISECONDS, and the script caps it, because an
      # override past this job's `timeout-minutes` gets the job CANCELLED, which
      # skips the reporting step below and leaves a red check with no message.
      - name: Discover Cloudflare Pages preview URL
        id: preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CF_PROJECT: sahajatlas.pages.dev # the app's *.pages.dev host (not the sahajatlas-design Ladle playground)
        run: node scripts/get-cloudflare-preview-url.mjs
      - name: Run smoke specs against the preview
        if: ${{ steps.preview.outputs.preview_url != '' }}
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          pnpm test:smoke
          {
            echo "### Smoke"
            echo ""
            echo "✅ Smoke specs ran against \`$PREVIEW_URL\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # A skip must never look like a pass. Discovery exits 0 with an empty URL
      # when no preview turns up, and the specs then skip themselves — so before
      # this step, a green "Smoke" check could equally mean "nothing ran". Now
      # the invariant holds: green implies the specs executed.
      #
      # Same-repo PRs have the secrets and the Cloudflare integration, so a
      # missing preview is a real failure — the deploy did not happen — and fails
      # the job. Forked PRs get no preview by design, so they stay a graceful
      # (but annotated) skip, as do local `pnpm test:smoke` runs.
      #
      # BOTH branches below stay red on a same-repo PR — that is the invariant,
      # and a slow deploy is still a run that verified nothing. What differs is
      # what we ask the reader to DO, because only one of them is a defect
      # (issue #132). `preview_status` carries the distinction the script can
      # honestly draw: `absent` means Cloudflare posted nothing at all for this
      # commit, while `pending`/`unreachable` mean a deploy demonstrably exists
      # and we stopped waiting on it. The old single message asked the reader to
      # work out which — from a script that had already discarded it.
      - name: Report a missing preview
        if: ${{ steps.preview.outputs.preview_url == '' }}
        env:
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PREVIEW_STATUS: ${{ steps.preview.outputs.preview_status }}
        run: |
          case "$PREVIEW_STATUS" in
            pending | unreachable)
              MSG="Cloudflare had not published a usable preview before discovery gave up — NO smoke specs ran."
              HINT="A Cloudflare deploy for this commit WAS seen ($PREVIEW_STATUS), so this is a slow deploy rather than a broken one: RE-RUN this job. The 'Discover Cloudflare Pages preview URL' step reports how long it waited and what it last saw. If it keeps happening, raise PREVIEW_TIMEOUT_MS on that step rather than re-running by hand."
              ;;
            failed)
              MSG="The Cloudflare Pages build for this commit FAILED — NO smoke specs ran."
              HINT="Cloudflare finished and did not succeed, so re-running this job will fail identically: read the Cloudflare deployment log. If that build failed in 0s with a clean log, it is a transient rate-limit — retry the DEPLOYMENT (not this job)."
              ;;
            error)
              MSG="Preview discovery could not run — NO smoke specs ran."
              HINT="This is a fault in the discovery step itself, not in Cloudflare: read the 'Discover Cloudflare Pages preview URL' step, which prints why (usually a missing GITHUB_TOKEN / PR_HEAD_SHA)."
              ;;
            # `absent`, and anything unrecognised — an unknown status is treated as
            # the loud case on purpose, so a future status can't quietly inherit
            # the softer "just re-run it" advice.
            *)
              MSG="No Cloudflare Pages preview was found for this commit — NO smoke specs ran."
              HINT="Nothing from Cloudflare turned up for this commit at all, so the deploy did not happen: INVESTIGATE, don't re-run. If the Pages build failed in 0s with a clean log, that is a transient rate-limit — retry the deployment itself."
              ;;
          esac
          {
            echo "### Smoke"
            echo ""
            echo "⚠️ $MSG"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SAME_REPO" = "true" ]; then
            echo "::error::$MSG This PR is from the same repository, so a preview was expected. $HINT"
            exit 1
          fi
          echo "::warning::$MSG Forked PRs have no preview deployment, so the specs were skipped."
